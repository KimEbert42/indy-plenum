name: CI

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - '**.py'
      - 'Dockerfile'
      - 'Dockerfile.base'
      - '.github/**'
      - 'bump_version.sh'

env:
  BASE_IMAGE: ghcr.io/${{ github.repository_owner }}/indy-plenum-base
  PROD_IMAGE: ghcr.io/${{ github.repository_owner }}/indy-plenum

jobs:
  build-base:
    name: Build Base Image
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build base image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.base
          push: ${{ github.event_name == 'push' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ env.BASE_IMAGE }}:latest

  build:
    name: Build Production Image
    needs: [build-base]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build production image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: ${{ github.event_name == 'push' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ env.PROD_IMAGE }}:latest
          build-args: BASE_IMAGE=${{ env.BASE_IMAGE }}:latest

  test:
    name: Test Plenum
    needs: [build]
    uses: ./.github/workflows/test.yaml
    with:
      image_tag: ghcr.io/${{ github.repository_owner }}/indy-plenum:latest
